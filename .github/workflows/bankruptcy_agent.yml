.github/workflows/bankruptcy_agent.yml
name: "Satakunnan Konkurssiseuranta Agentti"

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

jobs:
  run-bankruptcy-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "Tsekkaa koodi"
        uses: actions/checkout@v4

      - name: "Asenna Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: "Asenna riippuvuudet"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Suorita konkurssiseuranta-agentti"
        run: |
          python main.py

      - name: "Tallenna muutokset repositorioom"
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add reports/ data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automaattinen kuukausiraportti: $(date +'%Y-%m-%d')" && git push)

      - name: "Tallenna artefaktina"
        uses: actions/upload-artifact@v4
        with:
          name: konkurssiraportti-latest
          path: |
            reports/
            data/
