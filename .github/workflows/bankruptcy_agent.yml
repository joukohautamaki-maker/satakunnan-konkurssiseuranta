.github/workflows/bankruptcy_agent.yml
name: Satakunnan Konkurssiseuranta Agentti

on:
  schedule:
    # Suoritetaan joka kuukauden 1. päivä klo 06:00 UTC (klo 09:00 Suomen aikaa)
    - cron: '0 6 1 * *'
  workflow_dispatch: # Mahdollistaa manuaalisen käynnistyksen GitHubin käyttöliittymästä

jobs:
  run-bankruptcy-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Tarvitaan raporttien, kuvaajien ja CSV-datan kommitoimiseen repositorioosi

    steps:
      - name: Tsekkaa koodi (Checkout)
        uses: actions/checkout@v4

      - name: Asenna Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Asenna riippuvuudet
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Suorita konkurssiseuranta-agentti
        run: |
          python main.py

      - name: Tallennetaan uudet raportit ja data repositorioom
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add reports/ data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automaattinen kuukausiraportti: $(date +'%Y-%m-%d')" && git push)

      - name: Tallenna latauspaketti (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: konkurssiraportti-latest
          path: |
            reports/
            data/
