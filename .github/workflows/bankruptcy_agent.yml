name: "Satakunnan Konkurssiseuranta Agentti"

'on':
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch: {}

jobs:
  run-bankruptcy-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Asenna riippuvuudet"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Suorita agentti"
        run: python main.py

      - name: "Tallenna raportit"
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add reports/ data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automaattinen kuukausiraportti" && git push)
